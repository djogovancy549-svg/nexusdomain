# Cloudflare Workers & Pages Configuration for EbiDomain
# Deployment target: ebidomain.cvebi.workers.dev

name = "ebidomain"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Static Assets distribution folder generated by Vite
[assets]
directory = "./dist"
binding = "ASSETS"

# Build command configuration
[build]
command = "npm run build"

[vars]
APP_NAME = "EbiDomain"
DOMAIN = "ebidomain.cvebi.workers.dev"
COMPANY = "CV Ebi"
