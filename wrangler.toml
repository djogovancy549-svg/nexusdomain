# Cloudflare Workers Static Assets & Pages Configuration for EbiDomain
name = "ebidomain"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Static Assets configuration for Wrangler v4
assets = { directory = "./dist", not_found_handling = "single-page-application" }

[build]
command = "npm run build"

[vars]
APP_NAME = "EbiDomain"
DOMAIN = "sipermas.com"
COMPANY = "CV Ebi"
